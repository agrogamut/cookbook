# The whole stack on Render: Postgres, the Go API, and the operator console.
#
# One platform rather than a frontend host plus a separate backend host, because the console
# is useless without the API and the API is useless without the database. Split across
# providers, "is it up?" becomes three questions with three dashboards.
#
# Deploy: New > Blueprint in the Render dashboard, pointed at this repository. Render reads
# this file and creates all three.

# madamgy-db (Render Postgres, free plan) previously lived here as a `databases:` entry.
# Removed 2026-09-05: the free plan's 30-day expiry (this instance was 13 days from deletion
# when the move was made) is exactly the risk its own comment warned about -- "move off free
# before anyone records a real child" -- and Postgres is now Supabase instead, per this
# project's own stated fullstack default ("Prod via Supabase using the transaction pooler
# port 6543 -- never the direct IPv6-only host"). The Render Postgres instance itself is not
# deleted by removing it here; a Blueprint sync does not tear down resources it no longer
# declares. Deleting the old `madamgy-db` instance in the Render dashboard is a separate,
# deliberate step once Supabase is confirmed steady.
#
# madamgy-api's DATABASE_URL below changed from `fromDatabase` to a `sync: false` secret for
# exactly the reason GEMINI_API_KEY already uses that pattern -- the real Supabase connection
# string is not committed here.
#
# Two things this move required that a plain host swap would not have:
#   1. The transaction-mode pooler (port 6543) breaks golang-migrate's own connection under
#      pgx's default extended query protocol -- "prepared statement ... already exists"
#      (SQLSTATE 42P05), because the pooler can route consecutive statements to different
#      backend connections that do not share pgx's client-side statement cache. Fixed by
#      appending `?default_query_exec_mode=simple_protocol` to the connection string --
#      recognized directly by pgx.ParseConfig, so this needed no code change in internal/db.
#   2. Supabase's default project setup grants `anon`/`authenticated` full
#      SELECT/INSERT/UPDATE/DELETE on every table created in `public`, including
#      `child_profile` and its four related tables -- real names, dates of birth, allergies,
#      clinical conditions. That is Supabase's own Data API (PostgREST) exposure, a layer
#      this project never had an opinion about because it never had one before. Closed by
#      enabling row-level security with zero policies on every public table, run once
#      directly against the database: `anon`/`authenticated` are now denied at every row,
#      and the API's own connection is unaffected because RLS does not restrict a table's
#      owner. Not expressed in this file because it is a one-time database-level change, not
#      a Render resource.

services:
  # ---------------------------------------------------------------------------------------
  # The engine API. Docker rather than a native Go build because the image also carries
  # Chromium and Bengali fonts: every ingredient has a Bengali name, and printing a book
  # without a shaping engine produces ingredient names that are subtly and silently wrong.
  # See the Dockerfile.
  # ---------------------------------------------------------------------------------------
  - type: web
    name: madamgy-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free to start, so this deploys without a card. Chromium is the reason to watch it: a
    # free instance has 512 MB, and printing a 22-page book with a browser in that space is
    # tight. If a .pdf request returns 500 or the service restarts mid-print, that is the
    # memory ceiling and not a bug -- move this to starter.
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Supabase, transaction pooler (port 6543), with default_query_exec_mode=simple_protocol
      # -- see the note above the `services:` key for why both of those are load-bearing, not
      # stylistic. sync: false, same as GEMINI_API_KEY below: the real connection string is
      # set once in the Render dashboard (madamgy-api service > Environment), never committed.
      - key: DATABASE_URL
        sync: false

      # Load the provider's 14 workbooks on first boot. The importer is idempotent -- upsert
      # plus a sweep, every table content-hashed -- so leaving this set is safe, but it adds
      # about a minute to every start, so remove it once the first deploy is live.
      #
      # If the first deploy times out while importing, unset this and run `import` once from
      # the service's shell instead. The data is the same either way.
      - key: IMPORT_ON_START
        value: "1"

      # Chrome's sandbox cannot initialise as root with no user namespaces, which is every
      # container: without this the browser exits before printing anything. Safe here because
      # the browser only ever loads a document this service just rendered from its own
      # database -- it never visits a remote page.
      - key: CHROMIUM_NO_SANDBOX
        value: "1"

      # Optional -- read by internal/config, never fail-fast if unset (internal/aidraft.Disabled
      # takes over and every AI-drafted feature no-ops cleanly: clinical modification notes, the
      # invented-recipe chapter-shortfall fallback, Book 1 doctor-approach notes). sync: false
      # means the blueprint declares the var exists but the value is never committed here --
      # set the real key once in the Render dashboard (madamgy-api service > Environment).
      - key: GEMINI_API_KEY
        sync: false

      # The public origin of the console, with no trailing path. Two things read it and both
      # break quietly if it is wrong rather than loudly: the CORS allow-list is now this one
      # origin instead of "*", and config.Load derives SecureCookies from the scheme, so an
      # http value would ship a staff session cookie without the Secure flag over a public
      # HTTPS site. It has to match the console service's own URL below.
      - key: APP_ORIGIN
        value: https://madamgy-console.onrender.com

      # Staff identity. Supabase Auth holds the password; this service stores none. Both are
      # set together or neither -- config.Load rejects one without the other -- and with
      # neither set, staff sign-in is unavailable rather than open. Same Supabase project as
      # DATABASE_URL above. sync: false: the secret key is never committed here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

      # Optional consultation payment. Key id and secret are set together or neither; the
      # webhook secret verifies Razorpay's own callback signature. Unset, checkout is simply
      # not offered and registration still works.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------------------------------
  # The operator console.
  # ---------------------------------------------------------------------------------------
  - type: web
    name: madamgy-console
    runtime: node
    # The console holds no data and does no rendering of its own, so free is sufficient. Both
    # free services sleep after 15 minutes idle and take about a minute to wake.
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, not read at runtime,
      # so this has to be a build-time variable -- which is what a Blueprint envVar is.
      #
      # Written out rather than referenced with fromService, which cannot express it: Render
      # exposes only host, port and hostport for a service, and all three are private-network
      # values. This URL is fetched by the operator's browser, which has no route to the
      # private network, so `property: host` yielded https://madamgy-api and every call
      # failed with "Failed to fetch" -- a page that renders perfectly and can reach nothing.
      #
      # It therefore has to match the api service's name above. Change one and change both.
      - key: NEXT_PUBLIC_API_URL
        value: https://madamgy-api.onrender.com

      # The console proxies /api to the Go service through a Next rewrite, so the browser only
      # ever talks to this origin. That is what makes the HttpOnly session cookie work at all:
      # it is SameSite=Lax and host-only, and a cross-origin call straight from the browser to
      # madamgy-api would not carry it. next.config.ts reads this at build and at start, and
      # falls back to NEXT_PUBLIC_API_URL above when it is unset.
      - key: API_PROXY_URL
        value: https://madamgy-api.onrender.com
